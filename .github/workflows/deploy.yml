name: Deploy to Droplet

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on every PR and before every deploy. There is no other gate: a push
  # to main that fails this never reaches the droplet.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  deploy:
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Stop at the first failing command, so a failed step fails the job
            # instead of restarting the old code and reporting success.
            set -euo pipefail
            cd /opt/graphql-api
            # The droplet is a deploy target only: match origin/main exactly,
            # even over stray untracked files. .env is gitignored and untouched.
            git fetch origin main
            git reset --hard origin/main
            git log --oneline -1
            # Installs exactly the lockfile, without rewriting it.
            npm ci --omit=dev
            # Starts the app on first deploy; afterwards restarts it with the
            # ecosystem file re-read, so config changes take effect.
            pm2 startOrRestart ecosystem.config.cjs --update-env
            pm2 save
            # Fail the job if the server isn't answering after the restart.
            for i in $(seq 1 15); do
              curl -sf -m 3 localhost:4000/graphql -H 'content-type: application/json' \
                -d '{"query":"{ __typename }"}' && exit 0
              sleep 2
            done
            echo "graphql-api did not come up; recent logs:"
            pm2 logs graphql-api --lines 30 --nostream
            exit 1
